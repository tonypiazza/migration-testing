clusterName: es-source
version: "8.17.0"

# Install the repository-gcs plugin via an init container. Needed on Elasticsearch 7.x
# (GCS support is bundled in 8.0+). Leave false for 8.x.
installGcsPlugin: false

nodeSets:
  - name: default
    count: 3
    javaOpts: "-Xms4g -Xmx4g"
    resources:
      requests:
        memory: 8Gi
        cpu: 2
      limits:
        memory: 8Gi
        cpu: 4
    storage: 50Gi

http:
  type: LoadBalancer
  allowedCIDRs:
    - "0.0.0.0/0"
  psc:
    enabled: false
    subnet: ""
    natSubnet: ""
    consumerProjectIds: []
    dnsName: ""
    connectionLimit: 10
